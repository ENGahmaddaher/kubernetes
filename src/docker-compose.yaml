services:
  postgres:
    image: postgres:16-alpine
    container_name: microservices-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: mydb
    networks:
      - microservices-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  api-node:
    image: entransistor/api-node:v1.0.0
    container_name: microservices-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: secret123
      DB_NAME: mydb
      PORT: 3001
    networks:
      - microservices-network
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  client-react:
    image: entransistor/client-react:v1.0.2
    container_name: microservices-react
    networks:
      - microservices-network
    ports:
      - "8080:8080"
    depends_on:
      - api-node

networks:
  microservices-network:
    driver: bridge

volumes:
  postgres_data:
