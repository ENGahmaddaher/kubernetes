version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build: .
    environment:
      DATABASE_URL: "postgres://admin:secret123@db:5432/mydb?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
