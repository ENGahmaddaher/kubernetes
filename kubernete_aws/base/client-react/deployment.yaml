apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-react
  namespace: microservices-demo
  labels:
    app: client-react
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-react
  template:
    metadata:
      labels:
        app: client-react
    spec:
      containers:
      - name: client-react
        image: entransistor/client-react:1d711ffc3641c8a34db275c673fe6eefb657b13a
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
