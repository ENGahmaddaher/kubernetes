apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgresql/
  - api-node/
  - client-react/
  - ingress.yaml

namespace: microservices-demo

commonLabels:
  app.kubernetes.io/managed-by: kustomize

images:
  - name: entransistor/api-node
    newName: entransistor/api-node
    newTag: v1.0.0
  - name: entransistor/client-react
    newName: entransistor/client-react
    newTag: v1.0.2
  - name: postgres
    newName: postgres
    newTag: 16-alpine

replicas:
  - name: api-node
    count: 2
  - name: client-react
    count: 1
