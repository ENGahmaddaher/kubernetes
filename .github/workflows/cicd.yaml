name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '01-demo-application/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: entransistor

jobs:
  build-and-push:
    name: Build, Test & Push Images
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Run API tests
      run: |
        cd 01-demo-application/api-node
        npm ci
        npm test || echo "No tests found"

    - name: Run React tests
      run: |
        cd 01-demo-application/client-react
        npm ci
        npm test || echo "No tests found"

    - name: Build & Push API Node
      uses: docker/build-push-action@v5
      with:
        context: 01-demo-application/api-node
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/api-node:${{ github.sha }}
          ${{ env.IMAGE_PREFIX }}/api-node:latest

    - name: Build & Push Client React
      uses: docker/build-push-action@v5
      with:
        context: 01-demo-application/client-react
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/client-react:${{ github.sha }}
          ${{ env.IMAGE_PREFIX }}/client-react:latest

    - name: Build & Push Postgres Migrations
      uses: docker/build-push-action@v5
      with:
        context: 01-demo-application/postgres-migrations
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/postgres-migrations:${{ github.sha }}
          ${{ env.IMAGE_PREFIX }}/postgres-migrations:latest

  scan-images:
    name: Scan Images with Trivy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Scan API Node Image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_PREFIX }}/api-node:${{ github.sha }}
        format: 'table'
        exit-code: '0'
        severity: 'HIGH,CRITICAL'

    - name: Scan Client React Image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_PREFIX }}/client-react:${{ github.sha }}
        format: 'table'
        exit-code: '0'
        severity: 'HIGH,CRITICAL'

    - name: Scan Postgres Migrations Image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_PREFIX }}/postgres-migrations:${{ github.sha }}
        format: 'table'
        exit-code: '0'
        severity: 'HIGH,CRITICAL'

  update-manifests:
    name: Update Kubernetes Manifests
    needs: [build-and-push, scan-images]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}

    - name: Install kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/

    - name: Update images with kustomize
      run: |
        cd 02-deploy-demo-application-kubernetes/base
        kustomize edit set image entransistor/api-node=${{ env.IMAGE_PREFIX }}/api-node:${{ github.sha }}
        kustomize edit set image entransistor/client-react=${{ env.IMAGE_PREFIX }}/client-react:${{ github.sha }}

    #- name: Update migration image
     # run: |
      #  cd 02-deploy-demo-application-kubernetes/base/postgresql
       # kustomize edit set image entransistor/postgres-migrations=${{ env.IMAGE_PREFIX }}/postgres-migrations:${{ github.sha }}

    - name: Commit & Push Changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add 02-deploy-demo-application-kubernetes/
        git diff --quiet && git diff --staged --quiet || git commit -m "ci: update images to ${{ github.sha }} [skip ci]"
        git push
