kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  # ملاحظة: dnsDomain و kubeProxyMode ليسا حقولاً صحيحة هنا
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    extraMounts:
      - hostPath: /home/transistor/Desktop/devops-directive-kubernetes-course/03-installation-and-setup/kind-bind-mount-1
        containerPath: /some/path/in/container
    labels:
      ingress-ready: true
  - role: worker
    extraMounts:
      - hostPath: /home/transistor/Desktop/devops-directive-kubernetes-course/03-installation-and-setup/kind-bind-mount-2
        containerPath: /some/path/in/container
    labels:
      ingress-ready: true
